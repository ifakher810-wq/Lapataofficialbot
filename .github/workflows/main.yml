
name: LAPATA OFFICIAL BOT

on:
  workflow_dispatch:

jobs:
  minecraft-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mineflayer
        run: |
          npm init -y
          npm install mineflayer

      - name: Start Minecraft Bot
        run: |
          cat > bot.js <<'EOF'
          const mineflayer = require('mineflayer');

          const bot = mineflayer.createBot({
            host: 'FAKELAPATA1.aternos.me',
            port: 26176,
            username: 'LAPATA_BOT',
            version: '1.21'
          });

          bot.once('spawn', () => {
            console.log('LAPATA OFFICIAL JOINED!');

            setInterval(() => {
              const yaw = Math.random() * Math.PI * 2;
              const pitch = (Math.random() - 0.5) * 0.3;

              bot.look(yaw, pitch, true);
              console.log('Movement tick!');
            }, 5000);
          });

          bot.on('error', err => {
            console.log('NETWORK ERROR:', err.message);
          });

          bot.on('kicked', reason => {
            console.log('SERVER KICK:', reason);
          });

          bot.on('end', () => {
            console.log('BOT DISCONNECTED');
          });
          EOF

          node bot.js
          
