
name: LAPATA OFFICIAL BOT

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mineflayer
        run: npm install mineflayer

      - name: Start Minecraft Bot
        run: |
          cat > bot.js <<'EOF'
          const mineflayer = require('mineflayer');

          const bot = mineflayer.createBot({
            host: 'FAKELAPATA1.aternos.me',
            port: 26176,
            username: 'LapataBot',
            version: '1.21',
            connectTimeout: 20000
          });

          bot.on('spawn', () => {
            console.log('LAPATA BOT JOINED SUCCESSFULLY!');
          });

          bot.on('error', err => {
            console.log('ERROR:', err.message);
          });

          bot.on('kicked', reason => {
            console.log('KICKED:', reason);
          });

          bot.on('end', () => {
            console.log('DISCONNECTED');
          });
          EOF

          node bot.js
          
